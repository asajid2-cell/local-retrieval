# Insert into the harmonizerlabs.cc server block only after review.
# This is a separate upstream from production /multiplex/ (127.0.0.1:7683).
# The relay keeps its normal owner-cookie gate; /host remains token-gated by the relay.
location = /multiplex-test {
    return 301 /multiplex-test/;
}

location /multiplex-test/ {
    proxy_pass http://127.0.0.1:7683/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         "upgrade";
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Prefix  /multiplex-test;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
