name: writing-gate

# Scope: README.md only. The technical pages under docs/ predate this gate and
# are deliberately out of scope, so a green badge covers the README, not docs/.

on:
  pull_request:
    paths:
      - "README.md"
  push:
    branches: [main, release]
    paths:
      - "README.md"

permissions:
  contents: read

jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vale
        run: |
          base=https://github.com/vale-cli/vale/releases/download/v3.27.0
          cd /tmp
          curl -fsSLO "$base/vale_3.27.0_checksums.txt"
          curl -fsSLO "$base/vale_3.27.0_Linux_64-bit.tar.gz"
          sha256sum -c vale_3.27.0_checksums.txt --ignore-missing
          tar -xzf vale_3.27.0_Linux_64-bit.tar.gz -C /usr/local/bin vale

      - name: Lint prose
        run: vale README.md

      - name: Check shape
        run: node tools/check.mjs README.md
