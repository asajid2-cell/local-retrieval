extends: substitution
message: "Use '%s' instead of '%s'. Machine-register word."
description: "Words with measured post-2022 excess frequency. See WRITING-SYSTEM.md Part 3."
level: error
ignorecase: true
swap:
  "\\bdelve(?:s|d|ing)?\\b": "dig into"
  "\\btapestry\\b": "a plain description"
  "\\btestament\\b": "proof"
  "\\bunderscore(?:s|d|ing)?\\b": "show"
  "\\bshowcas(?:e|es|ed|ing)\\b": "show"
  "\\bpivotal\\b": "key"
  "\\bcrucial\\b": "important"
  "\\bintricate\\b": "complex"
  "\\bmeticulous(?:ly)?\\b": "careful"
  "\\brealm\\b": "area"
  "\\bfoster(?:s|ed|ing)?\\b": "encourage"
  "\\bgarner(?:s|ed|ing)?\\b": "get"
  "\\bboast(?:s|ed|ing)?\\b": "has"
  "\\bmyriad\\b": "many"
  "\\bplethora\\b": "many"
  "\\bparamount\\b": "most important"
  "\\bseamless(?:ly)?\\b": "say what does not break"
  "\\bvibrant\\b": "delete this word"
  "\\bprofound(?:ly)?\\b": "delete this word"
  "\\bholistic\\b": "whole"
  "\\bmultifaceted\\b": "say the parts"
  "\\bnuanced\\b": "say the distinction"
