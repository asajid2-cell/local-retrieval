extends: existence
message: "Slop phrase '%s'. Delete it and start with the point."
description: "Throat-clearing and stock openers. See SLOP-LIST.md section 1."
level: error
ignorecase: true
tokens:
  - "in today's (?:fast-paced|ever-evolving|ever-changing|digital|modern|hyper-connected) (?:world|landscape|era|age)"
  - "in an? (?:ever-evolving|ever-changing|rapidly changing|fast-paced) (?:landscape|world|era|age)"
  - "\\bas we all know\\b"
  - "\\bit'?s no secret that\\b"
  - "\\bwhen it comes to\\b"
  - "\\bat the end of the day\\b"
  - "\\blet'?s (?:dive|jump|kick things off|unpack)\\b"
  - "\\bbefore we (?:begin|get started|dive)\\b"
  - "\\bimagine a world where\\b"
  - "\\bever wondered\\b"
  - "\\bthe fact of the matter is\\b"
  - "\\bpicture this\\b"
  - "\\bhere'?s the thing\\b"
  - "\\bwhat if i told you\\b"
  - "\\bmost people don'?t know\\b"
