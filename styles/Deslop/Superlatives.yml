extends: existence
message: "Unproven superlative '%s'. Add a number or a link in this sentence, or delete it."
description: "Claims without evidence. See WRITING-SYSTEM.md rule 10."
level: error
ignorecase: true
scope: sentence
tokens:
  - "\\bworld[- ]class\\b"
  - "\\bbest[- ]in[- ]class\\b"
  - "\\bcutting[- ]edge\\b"
  - "\\bstate[- ]of[- ]the[- ]art\\b"
  - "\\bnext[- ]generation\\b"
  - "\\bgame[- ]changing\\b"
  - "\\brevolutionary\\b"
  - "\\bindustry[- ]leading\\b"
  - "\\bunmatched\\b"
  - "\\bunrival+ed\\b"
  - "\\bthe (?:fastest|smartest|most powerful|most advanced)\\b"
  - "\\bin the world\\b"
