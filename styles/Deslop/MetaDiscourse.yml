extends: existence
message: "Meta-discourse '%s'. The reader knows what they are reading."
description: "Writing about the writing. See SLOP-LIST.md section 2."
level: error
ignorecase: true
tokens:
  - "\\bin this (?:article|post|section|guide|page|document)\\b"
  - "\\bthis (?:article|section|post|guide|page) (?:will|explains|shows|covers|walks)\\b"
  - "\\bwe(?:'ll| will) (?:explore|cover|look at|delve into|examine how|take a look)\\b"
  - "\\bas (?:we|you)(?:'ll| will) see\\b"
  - "\\bas mentioned (?:above|earlier|previously)\\b"
  - "\\bin conclusion\\b"
  - "\\bto summarize\\b"
  - "\\bbefore we get started\\b"
  - "\\bfirst, let(?:'s| us)\\b"
