  - "\\btruly\\b"
  - "\\bincredibly\\b"
  - "\\bremarkably\\b"
  - "\\bextremely\\b"
  - "\\bdeeply\\b"
  - "\\bfundamentally\\b"
  - "\\butterly\\b"
  - "\\bperfectly\\b"
  - "\\bgenuinely\\b"
