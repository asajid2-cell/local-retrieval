extends: substitution
message: "Use '%s' instead of '%s'."
description: "Jargon with a plain equivalent. See SLOP-LIST.md section 5."
level: error
ignorecase: true
swap:
  "\\bleverage\\b": "use"
  "\\butiliz(?:e|es|ed|ing)\\b": "use"
  "\\butilization\\b": "use"
  "\\bfacilitate\\b": "help"
  "\\bcommence\\b": "start"
  "\\bterminate\\b": "end"
  "\\bharness(?:es|ed|ing)?\\b": "use"
  "\\bunlock(?:s|ed|ing)?\\b": "enable"
  "\\belevate\\b": "improve"
  "\\bempower(?:s|ed|ing)?\\b": "let"
  "\\bsupercharge\\b": "speed up"
  "\\bstreamline\\b": "cut"
  "\\becosystem\\b": "the actual list of tools"
  "\\blandscape\\b": "the actual domain"
  "\\bjourney\\b": "the steps"
  "\\bsolution\\b": "the product"
  "\\boffering\\b": "the product"
  "\\bbest practices\\b": "the named practice"
  "\\bmove the needle\\b": "the metric and the delta"
  "\\bin order to\\b": "to"
  "\\bprior to\\b": "before"
  "\\bsubsequent to\\b": "after"
  "\\bdue to the fact that\\b": "because"
  "\\bat this point in time\\b": "now"
  "\\ba number of\\b": "some"
