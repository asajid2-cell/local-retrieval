# Install on the VPS as /etc/ssh/sshd_config.d/98-client-liveness.conf, then:
#   sshd -t && systemctl reload ssh
# Verify with:  sshd -T | grep -i -E 'clientalive|tcpkeepalive'
#
# WHY THIS FILE EXISTS
#
# The remote bridge publishes this PC to the VPS with a reverse SSH tunnel
# (`ssh -R 127.0.0.1:8765:...`), and nginx proxies /multiplex/pc/ to that port. When a tunnel client
# disappears WITHOUT closing its TCP connection - a LAN blip, a suspended or force-killed supervisor,
# a killed console - sshd does not learn it is gone. It keeps the session, and it keeps the `-R`
# listener bound on 8765. That state is worse than an outage:
#
#   * the port still ACCEPTS TCP, so nginx connects happily and then waits its full read timeout
#     before answering 504 - the browser shows "PC archive unavailable" only after 120 seconds of
#     hang, instead of failing fast;
#   * every reconnect is refused with `Error: remote port forwarding failed for listen port 8765`,
#     so the supervisor's retry loop cannot recover the tunnel.
#
# Defaults make this last a long time: ClientAliveInterval is 0 (no probing) and TCPKeepAlive relies
# on net.ipv4.tcp_keepalive_time, which is 7200s - about two hours of a dead-but-bound port.
#
# Measured 2026-09-22 on the PC archive tunnel, with the client SUSPENDED so it could not answer:
#   without this file - listener still bound and hanging connections after 138s, no release in sight
#   with this file    - session reaped and the listener released in ~55s (3 x 15s, plus poll slack)
#
# A monitor must not be able to outlive its own client, and a published port must never accept a
# connection it cannot forward.
ClientAliveInterval 15
ClientAliveCountMax 3
