# harmonizerlabs.cc/remote -> the codex-local-retrieval remote server (running on the PC,
# published to this VPS as 127.0.0.1:8765 by a reverse tunnel).
#
# Paste into the harmonizerlabs.cc `server { ... }` block, REPLACING the two neutralizing
# `location = /remote { return 404; }` / `location /remote/ { return 404; }` lines. Then
# `sudo nginx -t && sudo systemctl reload nginx`.
#
# SECURITY MODEL (updated 2026-08-02 for the edge-gate apparatus — the old "nginx just forwards,
# the server gates itself" note was written before that existed and is no longer house style):
#   Layer 1, edge: auth_request -> hl-auth /internal/gate?page=remote, exactly like /archive,
#     /convert, /cameraroom etc. Unauthenticated requests never reach the tunnel at all.
#   Layer 2, app: the server still self-gates (CLR_REMOTE_HLAUTH=1, page "remote") and 302s to
#     /auth/login. Defence in depth — neither layer is load-bearing alone.
#   Replace <X-INTERNAL-KEY> below with the SAME X-Internal-Key value the sibling _gate_* blocks
#   already use in this file. Never commit the real value.

location = /_gate_remote {
    internal;
    proxy_pass http://127.0.0.1:4200/internal/gate?page=remote;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Internal-Key <X-INTERNAL-KEY>;
    proxy_set_header Cookie $http_cookie;
}
location @login_remote { return 302 /auth/login?next=$request_uri; }

location = /remote { return 301 /remote/; }

location /remote/ {
    auth_request /_gate_remote;
    error_page 401 = @login_remote;

    proxy_pass http://127.0.0.1:8765/;         # the reverse-tunnel port from the PC (loopback only)
    proxy_http_version 1.1;
    # Live agent sessions stream over /api/agent — without these two headers the WS upgrade
    # silently fails and the terminal never attaches.
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         "upgrade";
    proxy_set_header Host               $host;   # keeps the server's /auth/login redirect same-origin
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Prefix /remote;
    # Cookie (hl_session) is forwarded automatically — both layers need it.
    proxy_read_timeout 86400s;                  # long-lived WS + slow co-pilot turns
    proxy_send_timeout 86400s;
}
