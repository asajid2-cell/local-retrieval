<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Codex Archive</title>
<style>
  /* ---- visual system: a sober "terminal archive". near-black surfaces, one warm-amber accent,
       system text + monospace for ids/rollout. 8px spacing scale, 2 text weights, 2 radii. ---- */
  :root{
    --bg:#0b0b0d; --panel:#141417; --panel-2:#1a1a1f; --line:#26262d;
    --ink:#ececf1; --ink-mid:#a2a2ae; --ink-dim:#6f6f7b;
    --accent:#e0a24e; --accent-ink:#1a1206; --cx:#6fb1ff; --cl:#c89bff; --danger:#ff7a7a;
    --r-card:12px; --r-ctl:9px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:14px; line-height:1.5; -webkit-text-size-adjust:100%;
    /* app shell: header + scrolling middle + tab bar, so content never slides under a fixed bar */
    height:100dvh; display:flex; flex-direction:column; overflow:hidden;
  }
  img{max-width:100%;height:auto}
  button{font:inherit;color:inherit;cursor:pointer}
  a{color:var(--accent)}

  /* layout shell */
  .appbar{
    flex:none; z-index:20; display:flex; align-items:center; gap:10px;
    padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top));
    background:var(--bg); border-bottom:1px solid var(--line);
  }
  .appbar .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-dim);flex:none}
  .appbar .dot.ok{background:#5fd08a} .appbar .dot.bad{background:var(--danger)}
  .appbar h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px;white-space:nowrap}
  .appbar .sub{font-size:11px;color:var(--ink-dim);margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .appbar .spacer{flex:1 1 auto;min-width:0}
  .iconbtn{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r-ctl);
    min-height:38px; min-width:38px; padding:0 10px; color:var(--ink-mid); font-size:12px;
  }
  .iconbtn:hover{border-color:var(--accent);color:var(--ink)}

  main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%;max-width:760px;margin:0 auto;padding:16px}

  /* controls */
  .search{display:flex;gap:8px;margin-bottom:12px}
  input.txt,textarea.txt{
    width:100%; min-width:0; background:var(--panel); color:var(--ink);
    border:1px solid var(--line); border-radius:var(--r-ctl); padding:11px 12px; font:inherit;
  }
  input.txt:focus,textarea.txt:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  textarea.txt{resize:vertical;min-height:56px;max-height:200px;font-family:var(--sans)}
  .btn{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r-ctl);
    min-height:44px; padding:0 16px; color:var(--ink); font-weight:600; font-size:13px; white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.ghost{background:transparent}
  .btn.sm{min-height:36px;padding:0 12px;font-size:12px;font-weight:500}
  .btn:disabled{opacity:.5;cursor:default}

  .meta{color:var(--ink-dim);font-size:12px}
  .badge{
    display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:600;
    padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--ink-mid);flex:none
  }
  .badge.cx{color:var(--cx);border-color:#24405f} .badge.cl{color:var(--cl);border-color:#42345f}

  /* chat list */
  .list{display:flex;flex-direction:column;gap:8px}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r-card);
    padding:13px 14px; text-align:left; width:100%; display:block;
  }
  button.card:hover{border-color:#39394a;background:var(--panel-2)}
  .card .row{display:flex;align-items:center;gap:8px;min-width:0}
  .card .title{font-weight:600;font-size:14px;min-width:0;overflow-wrap:anywhere;flex:1 1 auto}
  .card .snip{color:var(--ink-mid);font-size:12.5px;margin-top:5px;overflow-wrap:anywhere}
  .card .sub{margin-top:7px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pin{color:var(--accent)}

  /* detail */
  .detail-head{margin-bottom:12px}
  .detail-head h2{font-size:17px;margin:6px 0 8px;overflow-wrap:anywhere}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
  .msg{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 14px;margin-bottom:8px}
  .msg .who{font-family:var(--mono);font-size:11px;color:var(--ink-dim);margin-bottom:5px}
  .msg .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
  .evt{font-family:var(--mono);font-size:12px;border-left:2px solid var(--line);padding:6px 0 6px 10px;margin:6px 0;overflow-wrap:anywhere}
  .evt .k{color:var(--accent)}

  /* co-pilot */
  .turn{margin-bottom:10px}
  .turn .who{font-size:11px;color:var(--ink-dim);margin-bottom:4px}
  .bubble{border:1px solid var(--line);border-radius:var(--r-card);padding:12px 14px;overflow-wrap:anywhere}
  .bubble.me{background:#15130c;border-color:#3a2e16}
  .bubble.ai{background:var(--panel);white-space:pre-wrap;font-size:13.5px}
  .bubble.ai code{font-family:var(--mono);background:#0e0e12;padding:1px 5px;border-radius:4px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .chip{font-family:var(--mono);font-size:10.5px;color:var(--ink-mid);background:#0e0e12;border:1px solid var(--line);border-radius:6px;padding:2px 7px}
  .composer{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
  .suggest{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .suggest .btn{white-space:normal;text-align:left;max-width:100%;height:auto;min-height:40px;padding:9px 12px;overflow-wrap:anywhere}

  .empty{color:var(--ink-dim);text-align:center;padding:40px 16px;border:1px dashed var(--line);border-radius:var(--r-card)}
  .note{color:var(--ink-mid);font-size:12.5px;margin:8px 0}
  .err{color:var(--danger);font-size:13px;margin:8px 0;overflow-wrap:anywhere}

  /* bottom tab bar */
  .tabbar{
    flex:none; z-index:20; display:flex;
    background:var(--bg); border-bottom:1px solid var(--line);
  }
  .tabbar button{
    flex:1; background:transparent; border:0; border-bottom:2px solid transparent; color:var(--ink-dim); min-height:46px;
    font-size:13px; font-weight:600; display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .tabbar button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
  .tabbar .gl{font-size:15px;line-height:1}

  /* token modal */
  /* while the access-token gate is up, the shell behind it is not interactive */
  body.gated .appbar .iconbtn, body.gated .tabbar{visibility:hidden}
  .modal[hidden]{display:none}
  .modal{
    position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:20px;
    background:rgba(0,0,0,.7);
  }
  .modal .sheet{width:min(100%,420px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:20px}
  .modal h2{margin:0 0 6px;font-size:16px}
  .modal p{margin:0 0 14px;color:var(--ink-mid);font-size:13px}
  .modal .row{display:flex;gap:8px;margin-top:12px}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <header class="appbar">
    <span class="dot" id="dot" title="connection"></span>
    <h1>Codex Archive</h1>
    <span class="sub" id="subtitle"></span>
    <span class="spacer"></span>
    <button class="iconbtn" id="refreshBtn" title="Reload">Reload</button>
    <button class="iconbtn" id="settingsBtn" title="Access token">Key</button>
  </header>

  <nav class="tabbar" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-chats" aria-selected="true"><span class="gl">▤</span>Chats</button>
    <button role="tab" id="tab-copilot" aria-selected="false"><span class="gl">✦</span>Co-pilot</button>
  </nav>

  <main id="view" aria-live="polite"></main>

  <div class="modal" id="tokengate" hidden role="dialog" aria-modal="true" aria-labelledby="tg-title">
    <div class="sheet">
      <h2 id="tg-title">Access token</h2>
      <p>Enter the token this server was started with (<code>CLR_REMOTE_TOKEN</code>). It's stored only in this browser.</p>
      <label class="visually-hidden" for="tg-input">Access token</label>
      <input class="txt" id="tg-input" type="password" autocomplete="current-password" placeholder="paste token">
      <div class="err" id="tg-err" hidden></div>
      <div class="row">
        <button class="btn primary" id="tg-save" style="flex:1">Connect</button>
      </div>
    </div>
  </div>

<script>
const App = {
  token: localStorage.getItem('clr_token') || '',
  tab: 'chats',
  chats: [], stats: null, q: '',
  detail: null, showRollout: false,
  copilot: [], copilotBusy: false, copilotCtl: null,
};

const $ = (s,r=document)=>r.querySelector(s);
const el = (t,p={},...kids)=>{const e=document.createElement(t);for(const k in p){if(k==='class')e.className=p[k];else if(k==='html')e.innerHTML=p[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),p[k]);else e.setAttribute(k,p[k]);}for(const c of kids.flat()){if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));}return e;};
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = s => { if(!s) return ''; const d=new Date(s); return isNaN(d)?'':d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); };
const toolBadge = t => el('span',{class:'badge '+(t==='claude'?'cl':'cx')}, t==='claude'?'CL':'CX');

// Base path = the directory this page is served from, so /api calls work whether the app is at
// localhost:8765/ or behind a reverse proxy at harmonizerlabs.cc/remote/.
const BASE = location.pathname.replace(/\/[^/]*$/, '');
async function api(path, opts={}){
  const headers = Object.assign({'Authorization':'Bearer '+App.token}, opts.headers||{});
  if(opts.body){ headers['Content-Type']='application/json'; opts.body=JSON.stringify(opts.body); }
  const res = await fetch(BASE+path, Object.assign({}, opts, {headers}));
  if(res.status===401){ openGate(App.token?'That token was rejected.':null); throw new Error('unauthorized'); }
  if(!res.ok){ let m; try{m=(await res.json()).error;}catch{m=res.statusText;} throw new Error(m||('HTTP '+res.status)); }
  return res.json();
}

/* ---------- token gate ---------- */
function openGate(msg){
  const g=$('#tokengate'); g.hidden=false; document.body.classList.add('gated');
  const err=$('#tg-err'); if(msg){err.textContent=msg;err.hidden=false;} else err.hidden=true;
  const inp=$('#tg-input'); inp.value=App.token||''; setTimeout(()=>inp.focus(),50);
}
function closeGate(){ $('#tokengate').hidden=true; document.body.classList.remove('gated'); }
$('#tg-save').addEventListener('click', saveToken);
$('#tg-input').addEventListener('keydown', e=>{ if(e.key==='Enter') saveToken(); });
async function saveToken(){
  const v=$('#tg-input').value.trim(); if(!v) return;
  App.token=v; localStorage.setItem('clr_token', v);
  closeGate(); setDot('idle'); boot();
}

function setDot(state){
  const d=$('#dot'); d.className='dot'+(state==='ok'?' ok':state==='bad'?' bad':'');
}

/* ---------- tabs ---------- */
$('#tab-chats').addEventListener('click',()=>switchTab('chats'));
$('#tab-copilot').addEventListener('click',()=>switchTab('copilot'));
function switchTab(t){
  App.tab=t; App.detail=null;
  $('#tab-chats').setAttribute('aria-selected', t==='chats');
  $('#tab-copilot').setAttribute('aria-selected', t==='copilot');
  render();
}
$('#settingsBtn').addEventListener('click',()=>openGate());
$('#refreshBtn').addEventListener('click',()=>{ if(App.tab==='chats'){loadChats(App.q);} });

/* ---------- data ---------- */
async function boot(){
  try{
    const h=await api('/api/stats'); App.stats=h; setDot('ok');
    $('#subtitle').textContent = h.totalChats+' chats';
    await loadChats('');
  }catch(e){ if(e.message!=='unauthorized'){ setDot('bad'); renderError(e.message); } }
}
async function loadChats(q){
  App.q=q;
  try{
    const r=await api('/api/chats?limit=40&q='+encodeURIComponent(q||''));
    App.chats=r.results; if(App.tab==='chats'&&!App.detail) render();
  }catch(e){ if(e.message!=='unauthorized') renderError(e.message); }
}
async function openDetail(id){
  try{
    App.detail=await api('/api/chats/'+encodeURIComponent(id)); App.showRollout=false; App.events=null; App.resumeResult=null; render();
  }catch(e){ renderError(e.message); }
}
async function loadMoreMessages(){
  const d=App.detail; if(!d) return;
  try{
    const next=await api('/api/chats/'+encodeURIComponent(d.id)+'?page='+(d.page+1)+'&pageSize='+d.pageSize);
    d.messages=d.messages.concat(next.messages); d.page=next.page; d.hasMore=next.hasMore; render();
  }catch(e){ renderError(e.message); }
}
async function loadRollout(){
  if(!App.detail) return;
  App.showRollout=true; render();
  try{ App.events=await api('/api/chats/'+encodeURIComponent(App.detail.id)+'/events?limit=300'); render(); }
  catch(e){ renderError(e.message); }
}
async function doResume(id){
  App.resumeResult={loading:true}; render();
  try{ App.resumeResult=await api('/api/chats/'+encodeURIComponent(id)+'/resume',{method:'POST',body:{launch:true}}); }
  catch(e){ App.resumeResult={error:e.message}; }
  render();
}
async function togglePin(d){
  try{ const r=await api('/api/chats/'+encodeURIComponent(d.id)+'/favorite',{method:'POST',body:{favorite:!d.pinned}});
    if(r.ok){ d.pinned=!d.pinned; render(); } }catch(e){ alert(e.message); }
}

/* ---------- co-pilot ---------- */
const SUGGEST=['Summarize my most recent chat','How many chats do I have and what are the top workspaces?','Find chats about VENPOD','Make a restore packet for my latest chat'];
async function sendCopilot(text){
  text=(text||'').trim(); if(!text||App.copilotBusy) return;
  App.copilot.push({role:'user',content:text});
  App.copilotBusy=true; App.copilotErr=null; App.copilotCtl=new AbortController(); render();
  const history=App.copilot.filter(m=>m.role==='user'||m.role==='assistant').slice(-20).map(m=>({role:m.role,content:m.content}));
  try{
    const r=await api('/api/copilot',{method:'POST',body:{message:text,history:history.slice(0,-1)},signal:App.copilotCtl.signal});
    App.copilot.push({role:'assistant',content:r.answer||r.error||'(no answer)',activity:r.activity});
    if(r.error&&!r.answer) App.copilotErr=r.error;
  }catch(e){ App.copilotErr=(e.name==='AbortError')?'Stopped.':e.message; }
  finally{ App.copilotBusy=false; App.copilotCtl=null; render(); }
}
function stopCopilot(){ if(App.copilotCtl) App.copilotCtl.abort(); }

/* ---------- render ---------- */
function render(){
  const v=$('#view'); v.innerHTML='';
  if(App.tab==='copilot') return renderCopilot(v);
  if(App.detail) return renderDetail(v);
  return renderChats(v);
}
function renderError(m){ const v=$('#view'); v.prepend(el('div',{class:'err'}, m)); }

function renderChats(v){
  const input=el('input',{class:'txt',type:'search',placeholder:'Search your chats…','aria-label':'Search chats',value:App.q});
  let t; input.addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>loadChats(e.target.value),250);});
  v.append(el('div',{class:'search'}, input));
  if(App.stats) v.append(el('div',{class:'meta',style:'margin-bottom:12px'},
    `${App.stats.totalChats} chats · ${App.stats.byTool?.codex||0} codex · ${App.stats.byTool?.claude||0} claude · ${App.stats.favorites} pinned`));
  if(!App.chats.length){ v.append(el('div',{class:'empty'}, App.q?'No chats match that search.':'No chats indexed yet.')); return; }
  const list=el('div',{class:'list'});
  for(const c of App.chats){
    list.append(el('button',{class:'card',onclick:()=>openDetail(c.id)},
      el('div',{class:'row'},
        c.pinned?el('span',{class:'pin'},'★'):null,
        el('span',{class:'title'}, c.title||'(untitled)')),
      c.snippet?el('div',{class:'snip'}, c.snippet):null,
      el('div',{class:'sub'}, toolBadge(c.tool), el('span',{class:'meta'}, c.workspace||'—'), el('span',{class:'meta'}, fmtDate(c.updatedAt)))
    ));
  }
  v.append(list);
}

function renderDetail(v){
  const d=App.detail;
  const head=el('div',{class:'detail-head'},
    el('button',{class:'btn ghost sm',onclick:()=>{App.detail=null;render();}},'‹ Back'),
    el('h2',{}, d.title||'(untitled)'),
    el('div',{class:'sub'}, toolBadge(d.tool), el('span',{class:'meta'}, d.workspace||'—'),
       el('span',{class:'meta'}, fmtDate(d.updatedAt)), el('span',{class:'meta'}, d.totalMessages+' msgs')),
    el('div',{class:'actions'},
      el('button',{class:'btn sm',onclick:()=>togglePin(d)}, d.pinned?'★ Pinned':'☆ Pin'),
      el('button',{class:'btn sm',onclick:()=>doResume(d.id)},'⏵ Resume in terminal'),
      el('button',{class:'btn sm'+(App.showRollout?' primary':''),onclick:()=>App.showRollout?(App.showRollout=false,render()):loadRollout()}, App.showRollout?'Messages':'Rollout'))
  );
  v.append(head);
  if(App.resumeResult) v.append(resumeCard(App.resumeResult));
  if(App.showRollout){
    if(!App.events){ v.append(el('div',{class:'note'}, el('span',{class:'spin'}),' loading rollout…')); return; }
    if(!App.events.events.length){ v.append(el('div',{class:'empty'},'No raw events for this chat.')); return; }
    for(const e of App.events.events){
      v.append(el('div',{class:'evt'}, el('span',{class:'k'}, e.kind+' '), el('span',{class:'meta'}, e.timestamp), el('div',{class:'body',html:esc(e.preview)})));
    }
    return;
  }
  if(!d.messages.length){ v.append(el('div',{class:'empty'},'No messages.')); return; }
  for(const m of d.messages){
    v.append(el('div',{class:'msg'}, el('div',{class:'who'}, m.role), el('div',{class:'body'}, m.text)));
  }
  if(d.hasMore) v.append(el('button',{class:'btn ghost',style:'width:100%;margin-top:4px',onclick:()=>loadMoreMessages()},
    'Load more — '+(d.totalMessages-d.messages.length)+' of '+d.totalMessages+' left'));
}

function resumeCard(r){
  if(r.loading) return el('div',{class:'note'}, el('span',{class:'spin'}),' starting…');
  if(r.error) return el('div',{class:'err'}, 'Resume failed: '+r.error);
  return el('div',{class:'msg'},
    el('div',{class:'who'}, r.launched ? 'Launched a terminal on the host ✓' : 'Run this to resume:'),
    el('div',{class:'evt',style:'margin:6px 0 0'}, r.command||'(no command)'),
    r.note ? el('div',{class:'meta',style:'margin-top:6px'}, r.note) : null);
}

function inlineMd(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+?)`/g,'<code>$1</code>'); }
function md(s){
  return (s||'').replace(/\r/g,'').split('\n').map(function(line){
    var h=line.match(/^(#{1,3})\s+(.*)/); if(h) return '<b>'+inlineMd(h[2])+'</b>';
    var b=line.match(/^\s*[-*]\s+(.*)/);  if(b) return '  •  '+inlineMd(b[1]);
    return inlineMd(line);
  }).join('\n');
}
function renderCopilot(v){
  if(!App.copilot.length){
    v.append(el('div',{class:'note'},'Ask about your archive — the co-pilot can search, summarize, and pull up stats (read-only over here).'));
    const sg=el('div',{class:'suggest'});
    for(const s of SUGGEST) sg.append(el('button',{class:'btn ghost sm',onclick:()=>sendCopilot(s)}, s));
    v.append(sg);
  }
  const thread=el('div',{});
  for(const m of App.copilot){
    if(m.role==='user') thread.append(el('div',{class:'turn'}, el('div',{class:'who'},'You'), el('div',{class:'bubble me'}, m.content)));
    else thread.append(el('div',{class:'turn'}, el('div',{class:'who'},'Co-pilot'),
      el('div',{class:'bubble ai',html:md(m.content)}),
      m.activity&&m.activity.length?el('div',{class:'chips'}, m.activity.map(a=>el('span',{class:'chip'}, a.tool))):null));
  }
  if(App.copilotBusy) thread.append(el('div',{class:'note'}, el('span',{class:'spin'}),' thinking…'));
  if(App.copilotErr) thread.append(el('div',{class:'err'}, App.copilotErr));
  v.append(thread);

  const ta=el('textarea',{class:'txt',rows:'1',placeholder:'Ask about your chats…','aria-label':'Message',disabled:App.copilotBusy?'':null});
  ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const t=ta.value;ta.value='';sendCopilot(t);} });
  const send=el('button',{class:'btn primary',onclick:()=>{const t=ta.value;ta.value='';sendCopilot(t);}}, 'Send');
  const stop=el('button',{class:'btn',onclick:()=>stopCopilot()}, 'Stop');
  v.append(el('div',{class:'composer'}, ta, App.copilotBusy?stop:send));
  if(App.tab==='copilot'&&!App.copilotBusy) setTimeout(()=>ta.focus(),30);
}

/* ---------- start ---------- */
