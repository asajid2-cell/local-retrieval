# harmonizerlabs.cc/remote -> the codex-local-retrieval remote server.
#
# Paste these two locations into the existing `server { ... }` block for harmonizerlabs.cc
# (the same TLS server that already proxies /auth, /cloud-squeeze, etc.), then `nginx -t` && reload.
#
# The server runs on YOUR PC and is reached here via a reverse tunnel that publishes it on the VPS
# as 127.0.0.1:8765 (e.g. `ssh -N -R 127.0.0.1:8765:127.0.0.1:8765 you@vps`, kept up with autossh).
#
# Auth: the server gates ITSELF via hl-auth (it reads the hl_session cookie and asks
# /auth/api/access). So nginx just forwards — no auth_request needed here. Unauthenticated visitors
# are 302'd by the server to /auth/login?next=/remote (your existing sign-in page).

location = /remote { return 301 /remote/; }

location /remote/ {
    proxy_pass http://127.0.0.1:8765/;        # the reverse-tunnel port from your PC
    proxy_http_version 1.1;
    proxy_set_header Host              $host;  # so the server's redirect to /auth/login is same-origin
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Cookie (hl_session) is forwarded automatically — the server needs it to check access.
    proxy_read_timeout 300s;                   # co-pilot turns can take a little while
}
